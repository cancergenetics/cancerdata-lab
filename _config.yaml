# site properties and page defaults
title: UCD Cancer Data Lab
subtitle: University College Dublin
description: The UCD Cancer Data Lab uses large-scale data analysis to understand how genetic variation in cancer alters molecular interaction networks, and to identify ways to target these alterations therapeutically.
# clean, logo-only header/footer (no stock banner) — matches the old site
header: ""
footer: ""
header-dark: false
footer-dark: false
show-subtitle: false
proofer: false

# site social media and other links
links:
  email: colm.ryan@ucd.ie
  google-scholar: laT87KUAAAAJ
  github: cancergenetics
  twitter: colmr

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
